# Local development only. These credentials are not used in any deployed environment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hockey
      POSTGRES_PASSWORD: hockey
      POSTGRES_DB: hockey_iq
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hockey -d hockey_iq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
